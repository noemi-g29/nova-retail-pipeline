version: 2

models:
  - name: dim_date
    description: "Universal calendar dimension covering all sales and target dates."
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: "Customer dimension built from unique sales entries."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product dimension containing distinct product items and categories."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: fct_sales
    description: "Line-item sales fact table containing revenue and profit measures."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: gross_profit
        tests:
          - not_null

  - name: fct_targets
    description: "Monthly finance sales targets per region and product category."
    columns:
      - name: target_key
        tests:
          - unique
          - not_null
      - name: target_amount
        tests:
          - not_null

  - name: fct_reviews
    description: "Cleaned product review feedback."
    columns:
      - name: review_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id